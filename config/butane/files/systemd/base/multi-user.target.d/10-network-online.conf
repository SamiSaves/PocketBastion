[Unit]
# Quadlet gives every user container Wants=podman-user-wait-network-online.service,
# which polls the SYSTEM network-online.target and gives up after 90 seconds.
# Nothing on Fedora CoreOS pulls that target in, so the poll never succeeds: the
# first boot pays 90s before Orca starts, and so does every container
# restart afterwards. NetworkManager-wait-online.service is enabled and active,
# but it is WantedBy= the target, which does not start it — only something
# wanting the target does.
#
# Wants= and deliberately never After=: ordering multi-user.target after the
# network would put sshd behind DHCP, and SSH is this box's recovery path. The
# target only has to become active, not to have done so first.
Wants=network-online.target
